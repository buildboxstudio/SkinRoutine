    const INGREDIENT_RULES = [{

    const DAYS_MAP = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const CAT_ORDER = { "cleanser": 10, "toner": 20, "eye-care": 30, "face-serum": 40, "moisturizer": 60, "sunscreen": 70, "haircare": 99 };
    const CAT_LABELS = {
      "face-serum": "Serum Wajah",
      "eye-care": "Eye Care",
      "haircare": "Haircare",
      "cleanser": "Cleanser",
      "toner": "Toner",
      "moisturizer": "Moisturizer",
      "sunscreen": "Sunscreen"
    };
    const CAT_BADGE_STYLES = {
      "haircare": "bg-purple-50 text-purple-700 border-purple-200",
      "eye-care": "bg-emerald-50 text-emerald-700 border-emerald-200",
      "cleanser": "bg-sky-50 text-sky-700 border-sky-200",
      "toner": "bg-cyan-50 text-cyan-700 border-cyan-200",
      "moisturizer": "bg-teal-50 text-teal-700 border-teal-200",
      "sunscreen": "bg-amber-50 text-amber-700 border-amber-200"
    };

    function lightenColor(hex, amount) {
      if (amount === undefined) amount = 0.88;
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      var lr = Math.round(r + (255 - r) * amount);
      var lg = Math.round(g + (255 - g) * amount);
      var lb = Math.round(b + (255 - b) * amount);
      return "#" + lr.toString(16).padStart(2, "0") + lg.toString(16).padStart(2, "0") + lb.toString(16).padStart(2, "0");
    }

    function isScheduledOnDay(p, dayIndex) {
      if (Array.isArray(p.scheduleDays) && p.scheduleDays.length > 0) {
        return p.scheduleDays.indexOf(dayIndex) !== -1;
      }
      var u = (p.usage || "").toLowerCase();
      if (u.indexOf("2x seminggu") !== -1) {
        var defaultDays = (p.ingredient || "").indexOf("Retinol") !== -1 ? [0, 3] : [1, 4];
        return defaultDays.indexOf(dayIndex) !== -1;
      }
      if (u.indexOf("3x seminggu") !== -1) {
        return [1, 3, 5].indexOf(dayIndex) !== -1;
      }
      return true;
    }

    function getProductsForDay(products, dayIndex, time) {
      var list = products.filter(function (p) {
        if (time === "morning" && p.when.indexOf("Pagi") === -1) return false;
        if (time === "night" && p.when.indexOf("Malam") === -1) return false;
        return isScheduledOnDay(p, dayIndex);
      });

      // Prevent stacking Retinol with BHA/AHA exfoliating serums on the same night
      if (time === "night") {
        var hasRetinol = list.some(function (p) {
          return (p.ingredient || "").indexOf("Retinol") !== -1;
        });
        if (hasRetinol) {
          list = list.filter(function (p) {
            if (p.category !== "face-serum") return true;
            var ing = p.ingredient || "";
            if (ing.indexOf("Retinol") !== -1) return true;
            return ing.indexOf("BHA") === -1 && ing.indexOf("AHA") === -1 && ing.indexOf("Salicylic") === -1 && ing.indexOf("Glycolic") === -1;
          });
        }
      }

      return list.sort(function (a, b) {
        var oa = CAT_ORDER[a.category] || 50;
        var ob = CAT_ORDER[b.category] || 50;
        if (oa !== ob) return oa - ob;
        return (a.stepOrder || 50) - (b.stepOrder || 50);
      });
    }

    function buildRoutineSteps(products, dayIndex, time) {
      var scheduled = getProductsForDay(products, dayIndex, time);
      var prefix = time === "morning" ? "m" : "n";
      var hasCustom = function (cat) {
        return scheduled.some(function (p) { return p.category === cat; });
      };

      var baseSteps = [];
      if (!hasCustom("cleanser")) {
        if (time === "morning") {
          baseSteps.push({ key: "m_cleanser", label: "Gentle Facial Wash", note: "Busa lembut, bilas air hangat/dingin", order: 10 });
        } else {
          baseSteps.push({ key: "n_cleanser1", label: "First Cleanser (Micellar/Balm)", note: "Angkat kotoran, minyak & sunscreen", order: 8 });
          baseSteps.push({ key: "n_cleanser2", label: "Second Cleanser (Facial Wash)", note: "Pembersihan mendalam", order: 10 });
        }
      }
      if (!hasCustom("toner")) {
        baseSteps.push({
          key: prefix + "_toner",
          label: time === "morning" ? "Hydrating Toner / Essence" : "Hydrating Toner",
          note: time === "morning" ? "Tepuk-tepuk lembut untuk menyiapkan kulit" : "Balut kelembapan setelah cuci muka",
          order: 20
        });
      }
      if (!hasCustom("moisturizer")) {
        baseSteps.push({
          key: prefix + "_moisturizer",
          label: time === "morning" ? "Moisturizer Gel / Light Cream" : "Barrier Moisturizer Cream",
          note: time === "morning" ? "Kunci kelembapan tanpa minyak berlebih" : "Proteksi barrier & kuncian regenerasi malam",
          order: 60
        });
      }
      if (time === "morning" && !hasCustom("sunscreen")) {
        baseSteps.push({
          key: "m_sunscreen",
          label: "Sunscreen SPF 50+ PA++++",
          note: "Wajib 2 ruas jari & reapply tiap 3 jam",
          order: 70
        });
      }

      var prodSteps = scheduled.map(function (prod) {
        var catOrder = CAT_ORDER[prod.category] || 40;
        var keyPrefix = prod.category === "haircare" ? prefix + "_hc_" : prefix + "_prod_";
        return {
          key: keyPrefix + prod.id,
          label: (prod.brand ? prod.brand + " " : "") + prod.name,
          note: prod.desc,
          serumId: prod.id,
          category: prod.category,
          order: catOrder === 40 ? (prod.stepOrder || 40) : catOrder
        };
      });

      return baseSteps.concat(prodSteps).sort(function (a, b) {
        return a.order - b.order;
      });
    }

    function SkinRoutineApp() {
      const [activeTab, setActiveTab] = useState("today");
      const [products, setProducts] = useState(() => {
        try {
          var schema = localStorage.getItem("skinroutine_schema");
          var saved = localStorage.getItem("skinroutine_products");
          if (saved && schema === "1.2") {
            var parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
          localStorage.setItem("skinroutine_schema", "1.2");
          localStorage.setItem("skinroutine_products", JSON.stringify(DEFAULT_PRODUCTS));
          return DEFAULT_PRODUCTS;
        } catch (e) {
          return DEFAULT_PRODUCTS;
        }
      });
      const [completedSteps, setCompletedSteps] = useState(() => {
        try {
          const saved = localStorage.getItem("skinroutine_completed_v1");
          return saved ? new Set(JSON.parse(saved)) : new Set();
        } catch (e) {
          return new Set();
        }
      });

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isAboutOpen, setIsAboutOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [formData, setFormData] = useState({
        brand: "",
        name: "",
        category: "face-serum",
        ingredient: INGREDIENT_RULES[0].name,
        when: INGREDIENT_RULES[0].when,
        usage: "Setiap Hari",
        desc: "",
        color: "#00ACC1",
        light: "#E8F8FB",
        stepOrder: 40
      });

      useEffect(() => {
        const splash = document.getElementById("splash-screen");
        if (splash) splash.classList.add("fade-out");
      }, []);

      useEffect(() => {
        function onKeyDown(e) {
          if (e.key === "Escape") {
            setIsModalOpen(false);
            setIsAboutOpen(false);
          }
        }
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem("skinroutine_products", JSON.stringify(products));
        } catch (e) {}
      }, [products]);

      useEffect(() => {
        try {
          localStorage.setItem("skinroutine_completed_v1", JSON.stringify(Array.from(completedSteps)));
        } catch (e) {}
      }, [completedSteps]);

      const todayDate = useMemo(() => new Date(), []);
      const dayIndex = todayDate.getDay();
      const dayName = DAYS_MAP[dayIndex];
      const dateString = todayDate.toISOString().split("T")[0];

      const todayFaceSerums = useMemo(() => {
        return getProductsForDay(products, dayIndex, "night").filter(p => p.category === "face-serum");
      }, [products, dayIndex]);
      const hasRetinolTonight = todayFaceSerums.some(p => (p.ingredient || "").indexOf("Retinol") !== -1);
      const todaySchedule = useMemo(() => {
        var focus, vibe;
        if (hasRetinolTonight) {
          focus = "Retinol Night";
          vibe = "Regenerasi sel & anti-aging";
        } else if (todayFaceSerums.some(p => (p.ingredient || "").indexOf("BHA") !== -1)) {
          focus = "Anti Acne Care";
          vibe = "Fokus bersihkan pori & redakan jerawat";
        } else {
          focus = "Hydration & Barrier";
          vibe = "Fokus calming & perkuat skin barrier";
        }
        return { focus, vibe };
      }, [todayFaceSerums, hasRetinolTonight]);

      const toggleStep = stepKey => {
        setCompletedSteps(prev => {
          const next = new Set(prev);
          const fullKey = `${dateString}_${stepKey}`;
          if (next.has(fullKey)) {
            next.delete(fullKey);
          } else {
            next.add(fullKey);
          }
          return next;
        });
      };

      const isStepDone = stepKey => completedSteps.has(`${dateString}_${stepKey}`);

      const handleIngredientChange = selectedIngredient => {
        const rule = INGREDIENT_RULES.find(r => r.name === selectedIngredient);
        setFormData(prev => ({
          ...prev,
          ingredient: selectedIngredient,
          when: rule ? rule.when : prev.when
        }));
      };

      const handleCategoryChange = selectedCategory => {
        setFormData(prev => ({
          ...prev,
          category: selectedCategory,
          stepOrder: CAT_ORDER[selectedCategory] || 40
        }));
      };

      const handleSaveProduct = e => {
        e.preventDefault();
        if (!formData.name.trim()) return;
        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...p, ...formData } : p));
        } else {
          const newProduct = {
            id: "custom_" + Date.now(),
            ...formData
          };
          setProducts(prev => [...prev, newProduct]);
        }
        setIsModalOpen(false);
        setEditingProduct(null);
      };

      const handleEditProduct = prod => {
        setEditingProduct(prod);
        setFormData({
          brand: prod.brand || "",
          name: prod.name || "",
          category: prod.category || "face-serum",
          ingredient: prod.ingredient || INGREDIENT_RULES[0].name,
          when: prod.when || "Pagi & Malam",
          usage: prod.usage || "Setiap Hari",
          desc: prod.desc || "",
          color: prod.color || "#00ACC1",
          light: prod.light || "#E8F8FB",
          stepOrder: prod.stepOrder || CAT_ORDER[prod.category] || 40
        });
        setIsModalOpen(true);
      };

      const handleDeleteProduct = id => {
        if (confirm("Apakah kamu yakin ingin menghapus produk ini?")) {
          setProducts(prev => prev.filter(p => p.id !== id));
        }
      };

      const handleResetProducts = () => {
        if (confirm("Kembalikan katalog ke produk awal?")) {
          setProducts(DEFAULT_PRODUCTS);
        }
      };

      const morningSteps = useMemo(() => buildRoutineSteps(products, dayIndex, "morning"), [products, dayIndex]);
      const nightSteps = useMemo(() => buildRoutineSteps(products, dayIndex, "night"), [products, dayIndex]);

      const morningDoneCount = morningSteps.filter(s => isStepDone(s.key)).length;
      const nightDoneCount = nightSteps.filter(s => isStepDone(s.key)).length;
      const totalSteps = morningSteps.length + nightSteps.length;
      const totalDone = morningDoneCount + nightDoneCount;
      const overallPercent = totalSteps > 0 ? Math.round(totalDone / totalSteps * 100) : 0;

      return h("div", {
        className: "max-w-[480px] mx-auto min-h-screen flex flex-col bg-white shadow-lg relative border-x border-black/5"
      }, h("header", {
        className: "sticky top-0 z-40 bg-[#111D20] text-white px-5 py-4 flex items-center justify-between shadow-sm"
      }, h("div", {
        className: "flex items-center gap-3"
      }, h("div", {
        className: "w-10 h-10 rounded-xl bg-[#00ACC1]/20 border border-[#00ACC1]/40 flex items-center justify-center p-1.5"
      }, h("img", {
        src: "Icon App.png",
        alt: "SkinRoutine Logo",
        className: "w-full h-full object-contain rounded-lg"
      })), h("div", null, h("h1", {
        className: "text-[18px] font-extrabold tracking-tight leading-none text-white"
      }, "Skin", h("span", {
        className: "text-[#00ACC1]"
      }, "Routine")), h("p", {
        className: "text-[11px] text-white/70 mt-1 font-medium flex items-center gap-1.5"
      }, h("span", {
        className: "w-2 h-2 rounded-full bg-emerald-400 inline-block"
      }), dayName, ", ", todayDate.toLocaleDateString("id-ID", {
        day: "numeric",
        month: "short",
        year: "numeric"
      })))), h("div", {
        className: "text-right flex items-center gap-2"
      }, h("div", {
        className: "text-[11px] font-bold text-[#00ACC1] bg-[#00ACC1]/15 px-3 py-1 rounded-full border border-[#00ACC1]/30"
      }, overallPercent, "% Selesai"), h("button", {
        onClick: () => setIsAboutOpen(true),
        className: "w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs font-bold transition-colors",
        title: "Tentang Aplikasi",
        "aria-label": "Tentang Aplikasi"
      }, "i"))), h("main", {
        className: "flex-1 p-4 space-y-5"
      }, activeTab === "today" && h("div", {

          className: `w-full text-left rounded-[14px] border px-3.5 py-3 flex items-center gap-3 transition-colors cursor-pointer ${checked ? 'bg-[#F0FBFB] border-[#00ACC1]/40 opacity-75' : 'bg-white border-black/10 hover:border-black/20'}`
        }, h("div", {
          className: `w-6 h-6 rounded-full border flex items-center justify-center shrink-0 transition-colors ${checked ? 'bg-[#00ACC1] border-[#00ACC1] text-[#111D20] font-bold' : 'bg-white border-black/25'}`
        }, checked ? "✓" : ""), h("div", {
          className: "flex-1 min-w-0"
        }, h("div", {
          className: `text-[13px] font-bold leading-tight flex items-center gap-2 flex-wrap ${checked ? 'line-through text-black/50' : 'text-[#111D20]'}`
        }, serum && h("span", {
          className: "w-2.5 h-2.5 rounded-full inline-block shrink-0",
          style: { background: serum.color }
        }), step.label, step.category && step.category !== "face-serum" && h("span", {
          className: `text-[9px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded-md border shrink-0 ${CAT_BADGE_STYLES[step.category] || 'bg-gray-100 text-gray-700 border-gray-200'}`
        }, CAT_LABELS[step.category] || step.category)), step.note && h("div", {
          className: "text-[11px] text-black/55 mt-0.5"
        }, step.note)), serum && h("span", {
          className: "text-[10px] font-bold px-2 py-0.5 rounded-md shrink-0",
          style: {
            background: serum.light,
            color: serum.color
          }
        }, serum.brand || serum.name));
      })));
    }

    function NavItem({ active, onClick, icon, label }) {
      return h("button", {
        type: "button",
        onClick: onClick,
        className: `flex flex-col items-center justify-center py-1.5 px-3 rounded-xl transition-colors ${active ? 'text-[#00ACC1] bg-white/10 font-bold' : 'text-white/65 hover:text-white'}`
      }, h("span", {
        className: "text-lg leading-none"
      }, icon), h("span", {
        className: "text-[11px] mt-1"
      }, label));
    }

    function TipCard({ index, title, desc }) {
      return h("div", {
        className: "rounded-[18px] bg-white border border-black/10 p-4 flex gap-3 items-start"
      }, h("div", {
        className: "w-7 h-7 rounded-lg bg-[#F0FBFB] border border-[#00ACC1]/30 flex items-center justify-center text-[12px] font-extrabold text-[#006978] shrink-0"
      }, index), h("div", null, h("h4", {
        className: "font-extrabold text-[13px] text-[#111D20]"
      }, title), h("p", {
        className: "text-[11.5px] leading-relaxed text-black/65 mt-0.5"
      }, desc)));
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(SkinRoutineApp, null));
  })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          reg.update();
        }).catch(function(){});
      });
    }
  </script>
</body>
</html>

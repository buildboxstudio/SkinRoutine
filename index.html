// Helper: lighten a hex color by mixing with white
function lightenColor(hex, amount) {
  if (amount === undefined) amount = 0.88;
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  var lr = Math.round(r + (255 - r) * amount);
  var lg = Math.round(g + (255 - g) * amount);
  var lb = Math.round(b + (255 - b) * amount);
  return "#" + lr.toString(16).padStart(2, "0") + lg.toString(16).padStart(2, "0") + lb.toString(16).padStart(2, "0");
}

// Helper: get products scheduled for a given day and time, sorted by category then stepOrder

  return products.filter(function (p) {
    if (time === "morning" && p.when.indexOf("Pagi") === -1) return false;
    if (time === "night" && p.when.indexOf("Malam") === -1) return false;
    if (p.usage === "2x Seminggu" && p.scheduleDays) {
      return p.scheduleDays.indexOf(dayIndex) !== -1;
    }
    return true;
  }).sort(function (a, b) {
    var oa = CAT_ORDER[a.category] || 50;

    if (oa !== ob) return oa - ob;
